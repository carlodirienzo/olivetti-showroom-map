<title>Olivetti Showroom · Around the World</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0c0c12;--surface:#13131e;--surface2:#1c1c2a;
  --border:#252535;--accent:#d4a853;
  --text:#e8e4d8;--muted:#8a8070;--dim:#4a4840;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--text)}
#map{position:absolute;inset:0;background:var(--bg)!important}
.leaflet-container{background:var(--bg)!important}
.leaflet-control-zoom a{background:var(--surface2)!important;color:var(--muted)!important;border-color:var(--border)!important}
.leaflet-control-zoom a:hover{color:var(--accent)!important}
.leaflet-bar{border:1px solid var(--border)!important;box-shadow:none!important}
.leaflet-control-attribution{background:rgba(12,12,18,.8)!important;color:var(--dim)!important;font-size:9px!important}
.leaflet-control-attribution a{color:#3a6a9a!important}
header{
  position:absolute;top:0;left:0;right:0;z-index:1000;
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  pointer-events:none;
  background:linear-gradient(to bottom,rgba(12,12,18,.95) 55%,transparent);
}
.brand{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.sep{font-size:11px;color:var(--dim);margin:0 12px}
.subtitle{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ctr{font-size:10px;color:var(--dim);letter-spacing:.08em}
.ctr strong{color:var(--accent);font-weight:600}
.leaflet-popup-content-wrapper{
  background:var(--surface)!important;border:1px solid var(--border)!important;
  border-radius:10px!important;box-shadow:0 16px 48px rgba(0,0,0,.75)!important;
  padding:0!important;overflow:hidden
}
.leaflet-popup-tip-container{display:none!important}
.leaflet-popup-content{margin:0!important;width:272px!important}
.leaflet-popup-close-button{color:var(--muted)!important;top:8px!important;right:10px!important;font-size:18px!important;font-weight:300!important;z-index:10}
.leaflet-popup-close-button:hover{color:var(--text)!important}
.p-hero{width:100%;height:138px;background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.p-hero img{width:100%;height:100%;object-fit:cover;display:block}
.p-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim)}
.p-ph svg{opacity:.3}
.p-ph span{font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.p-yr{position:absolute;top:9px;left:9px;background:rgba(12,12,18,.88);border:1px solid var(--border);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:3px}
.p-body{padding:13px 15px 15px}
.p-eye{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.p-city{font-size:20px;font-weight:300;letter-spacing:.03em;color:var(--text);margin-bottom:3px}
.p-addr{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.4}
.p-div{border:none;border-top:1px solid var(--border);margin-bottom:9px}
.p-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.p-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;margin-right:10px}
.p-val{font-size:11px;color:var(--muted);text-align:right;line-height:1.4}
.p-acts{display:flex;gap:8px;margin-top:12px}
.p-btn{flex:1;padding:8px 0;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;text-decoration:none;display:block;transition:opacity .15s}
.p-btn:hover{opacity:.7}
.btn-m{background:#141428;color:#6a8fff;border:1px solid #1e1e45}
.btn-s{background:#141e14;color:#5abf5a;border:1px solid #1e3020}
.legend{position:absolute;bottom:30px;left:14px;z-index:900;background:rgba(19,19,30,.92);border:1px solid var(--border);border-radius:6px;padding:9px 13px;pointer-events:none}
.leg-t{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.leg-r{display:flex;align-items:center;gap:8px}
.leg-d{width:9px;height:9px;border-radius:50%;background:rgba(212,168,83,.2);border:1.5px solid var(--accent);flex-shrink:0}
.leg-l{font-size:10px;color:var(--muted)}
</style>

const DOT_R_BASE = 3.5; // radius at zoom 3

const DotLayer = L.Layer.extend({
  onAdd(map) {
    this._map = map;
    const pane = map.getPane('overlayPane');
    this._canvas = document.createElement('canvas');
    this._canvas.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none';
    pane.appendChild(this._canvas);
    map.on('moveend zoomend viewreset zoom', this._redraw, this);
    this._redraw();
  },
  onRemove(map) {
    this._canvas.remove();
    map.off('moveend zoomend viewreset zoom', this._redraw, this);
  },
  _redraw() {
    const map = this._map;
    const size = map.getSize();
    const canvas = this._canvas;
    canvas.width  = size.x;
    canvas.height = size.y;
    const origin = map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(canvas, origin);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const zoom = map.getZoom();
    // Dot radius scales with zoom: bigger when zoomed in
    const r = Math.max(1.5, DOT_R_BASE * Math.pow(1.55, zoom - 3));

    ctx.fillStyle = 'rgba(61,143,216,0.85)';
    ctx.beginPath();
    for (const [lat, lng] of DOT_COORDS) {
      const pt = map.latLngToContainerPoint([lat, lng]);
      ctx.moveTo(pt.x + r, pt.y);
      ctx.arc(pt.x, pt.y, r, 0, Math.PI*2);
    }
    ctx.fill();
  }
});

new DotLayer().addTo(map);

// Labels only on top
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{
  attribution:'© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/">OSM</a>',
  subdomains:'abcd', maxZoom:18, opacity:0.5, zIndex:10
}).addTo(map);

// ── Markers ──────────────────────────────────────────────────────────────
function mkIcon(){
  return L.divIcon({
    className:'',
    html:`<svg width="26" height="34" viewBox="0 0 26 34" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="13" cy="32" rx="5" ry="1.8" fill="rgba(0,0,0,0.45)"/>
      <path d="M13 2C7.48 2 3 6.48 3 12c0 8.25 10 22 10 22S23 20.25 23 12c0-5.52-4.48-10-10-10z"
        fill="#1a1428" stroke="#d4a853" stroke-width="1.6"/>
      <circle cx="13" cy="12" r="4.5" fill="#d4a853" opacity="0.95"/>
      <circle cx="13" cy="12" r="2" fill="#fff9e6" opacity="0.55"/>
    </svg>`,
    iconSize:[26,34], iconAnchor:[13,34], popupAnchor:[0,-36]
  });
}

function murl(s){ return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`; }
function surl(s){ return `https://www.google.com/maps/@${s.lat},${s.lng},3a,75y,0h,90t/data=!3m1!1e1`; }

function popup(s){
  const hero = s.img
    ? `<img src="${s.img}" alt="${s.city}" onerror="this.style.display='none'">`
    : `<div class="p-ph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>foto da aggiungere</span></div>`;
  const yr = s.year ? `<div class="p-yr">${s.year}</div>` : '';
  const arch = s.architect ? `<div class="p-row"><span class="p-lbl">Progettista</span><span class="p-val">${s.architect}</span></div>` : '';
  return `<div class="p-hero">${hero}${yr}</div>
    <div class="p-body">
      <div class="p-eye">Olivetti Showroom</div>
      <div class="p-city">${s.city}</div>
      <div class="p-addr">${s.address}</div>
      <hr class="p-div">${arch}
      <div class="p-acts">
        <a class="p-btn btn-m" href="${murl(s)}" target="_blank" rel="noopener">↗ Google Maps</a>
        <a class="p-btn btn-s" href="${surl(s)}" target="_blank" rel="noopener">↗ Street View</a>
      </div>
    </div>`;
}

SHOWROOMS.forEach(s => {
  L.marker([s.lat,s.lng],{icon:mkIcon(),zIndexOffset:1000})
    .addTo(map)
    .bindPopup(popup(s),{maxWidth:272,minWidth:272});
});
